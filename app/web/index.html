<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101a2c">
<title>СГУГиТ · Управление</title>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<style>
:root{color-scheme:dark;--bg:#0b1424;--panel:#142239;--panel2:#1a2c45;--line:#293c57;--text:#f2f6fc;--muted:#9aacc4;--lime:#d8f36b;--lime2:#b7d84d;--red:#ff7e83;--green:#9de4b2;--radius:22px;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{background:radial-gradient(ellipse at 85% -10%,#263e5e 0,transparent 42%),linear-gradient(160deg,#0b1424,#101c30 55%,#0a1423);padding:0 0 calc(78px + var(--safe-bottom));-webkit-font-smoothing:antialiased}button,select{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top,0px)) 18px 26px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:11px}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(145deg,#e8ff9a,#b9d94d);color:#17263a;display:grid;place-items:center;box-shadow:0 8px 24px #d8f36b22}.logo svg{width:27px;height:27px}.brand-name{font-weight:850;letter-spacing:.045em;font-size:16px}.brand-sub{font-size:9px;color:var(--muted);letter-spacing:.18em;margin-top:3px;font-weight:800}.live{display:flex;align-items:center;gap:7px;border:1px solid #9de4b244;background:#9de4b211;color:#a9ebbd;padding:8px 11px;border-radius:999px;font-size:11px;font-weight:750}.dot{width:7px;height:7px;border-radius:50%;background:#83e4a1;box-shadow:0 0 0 4px #83e4a122}.hero{position:relative;overflow:hidden;padding:24px 22px 20px;border-radius:28px;background:linear-gradient(130deg,#213954 0%,#182a43 55%,#142239 100%);border:1px solid #ffffff12;box-shadow:0 20px 55px #0003;margin-bottom:18px}.hero:after{content:"";position:absolute;width:210px;height:210px;border:1px solid #d8f36b22;border-radius:50%;right:-90px;top:-110px;box-shadow:0 0 0 22px #d8f36b08,0 0 0 48px #d8f36b05}.eyebrow{color:var(--lime);font-size:10px;letter-spacing:.16em;font-weight:850;text-transform:uppercase}.hero h1{font-size:clamp(28px,7vw,39px);line-height:1.04;letter-spacing:-.045em;margin:12px 0 9px;max-width:420px}.hero p{color:#b8c7d9;font-size:13px;line-height:1.5;margin:0;max-width:420px}.select-wrap{margin-top:19px;position:relative;z-index:1}.select-wrap label{display:block;font-size:10px;color:#aebfd3;font-weight:750;margin:0 0 7px 3px}.select{width:100%;appearance:none;background:#0d1a2d88;border:1px solid #ffffff20;border-radius:14px;padding:13px 42px 13px 14px;color:#fff;font-weight:700;outline:none}.select-wrap:after{content:"⌄";position:absolute;right:15px;bottom:8px;font-size:23px;color:var(--lime);pointer-events:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:23px}.stat{background:#15263d;border:1px solid #ffffff0b;border-radius:18px;padding:13px 12px;min-width:0}.stat-icon{font-size:17px;margin-bottom:8px}.stat-value{font-weight:850;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.stat-label{font-size:10px;color:var(--muted);margin-top:4px}.section-head{display:flex;align-items:end;justify-content:space-between;margin:23px 2px 11px}.section-head h2{font-size:17px;margin:0;font-weight:850;letter-spacing:-.02em}.section-head span{font-size:10px;color:var(--muted)}.card{background:linear-gradient(145deg,#172942,#132238);border:1px solid #ffffff0d;border-radius:21px;padding:16px;margin-bottom:10px;box-shadow:0 8px 28px #00000014}.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}.ico{width:39px;height:39px;border-radius:13px;background:#d8f36b14;color:var(--lime);display:grid;place-items:center;font-size:19px;flex:none}.title{font-size:13px;font-weight:800}.desc{font-size:11px;color:var(--muted);line-height:1.45;margin-top:4px}.switch{width:47px;height:27px;border-radius:99px;background:#35465d;padding:3px;border:0;flex:none;transition:.2s}.switch:before{content:"";display:block;width:21px;height:21px;border-radius:50%;background:#d6deea;transition:.2s;box-shadow:0 2px 5px #0003}.switch.on{background:var(--lime)}.switch.on:before{transform:translateX(20px);background:#17263a}.switch:focus-visible,.select:focus-visible,button:focus-visible{outline:2px solid var(--lime);outline-offset:3px}.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff0c}.setting:last-child{border-bottom:0;padding-bottom:0}.setting:first-child{padding-top:0}.setting-info{min-width:0}.setting-title{font-size:12px;font-weight:750}.setting-sub{font-size:10px;color:var(--muted);line-height:1.4;margin-top:4px}.control{background:#0d1a2d;border:1px solid #344963;border-radius:12px;color:#f2f6fc;padding:9px 30px 9px 11px;font-size:11px;font-weight:750;max-width:150px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;position:sticky;top:0;z-index:5;padding:9px 0 12px;background:linear-gradient(#0d1929f5,#0d1929e8);backdrop-filter:blur(14px);margin:0 -2px 15px}.tab{border:1px solid transparent;background:transparent;color:#91a4bd;border-radius:13px;padding:10px 3px;font-size:10px;font-weight:750}.tab.active{background:#d8f36b18;color:var(--lime);border-color:#d8f36b28}.tab .tabico{font-size:16px;display:block;margin-bottom:4px}.view{display:none;animation:rise .22s ease}.view.active{display:block}@keyframes rise{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.notice{display:flex;gap:10px;padding:13px;border-radius:16px;background:#d8f36b0d;border:1px solid #d8f36b22;color:#c8d6e7;font-size:11px;line-height:1.5;margin:12px 0}.notice b{color:var(--lime)}.permission{display:flex;align-items:flex-start;gap:11px;padding:13px 0;border-bottom:1px solid #ffffff0c}.permission:last-child{border:0;padding-bottom:0}.status{font-size:9px;font-weight:850;border-radius:999px;padding:5px 8px;white-space:nowrap}.ok{color:#9ce8b3;background:#9ce8b318}.bad{color:#ffb1b4;background:#ff7e8318}.unknown{color:#ffd68c;background:#ffc45b18}.permission p{margin:4px 0 0;color:var(--muted);font-size:10px;line-height:1.45}.btn{border:0;border-radius:14px;background:var(--lime);color:#142239;padding:13px 15px;font-size:12px;font-weight:850;width:100%;box-shadow:0 8px 22px #d8f36b1b}.btn:active{transform:scale(.985)}.btn.secondary{background:#263a55;color:#e5edf7;box-shadow:none;border:1px solid #ffffff10}.footer{text-align:center;color:#71849e;font-size:9px;letter-spacing:.08em;padding:18px 0 0}.toast{position:fixed;z-index:20;bottom:calc(82px + var(--safe-bottom));left:50%;transform:translate(-50%,14px);opacity:0;pointer-events:none;background:#e9f8ba;color:#17263a;padding:11px 16px;border-radius:999px;font-size:11px;font-weight:850;box-shadow:0 10px 35px #0006;transition:.22s;max-width:calc(100% - 32px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.empty{text-align:center;padding:48px 22px}.empty .big{font-size:42px;margin-bottom:14px}.empty h2{font-size:22px;margin:0 0 8px}.empty p{font-size:12px;line-height:1.6;color:var(--muted)}.loading{height:5px;background:#253952;border-radius:9px;overflow:hidden;margin-top:12px}.loading:after{content:"";display:block;height:100%;width:40%;background:var(--lime);border-radius:9px;animation:load 1.1s infinite ease-in-out}@keyframes load{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}@media(min-width:600px){.app{padding-left:28px;padding-right:28px}.hero{padding:30px}.card{padding:19px}.tabs{position:static;background:none;backdrop-filter:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5 12 4l9 4.5-9 4.5-9-4.5Z"/><path d="M6.5 10.5v5c3.4 2.7 7.6 2.7 11 0v-5M21 9v6"/></svg></div><div><div class="brand-name">СГУГиТ</div><div class="brand-sub">ЦЕНТР УПРАВЛЕНИЯ</div></div></div>
    <div class="live"><i class="dot"></i> Система онлайн</div>
  </header>
  <div id="content"><div class="hero"><div class="eyebrow">Панель группы</div><h1>Всё под<br>контролем.</h1><p>Загружаем настройки вашего чата…</p><div class="loading"></div></div></div>
  <div class="footer">СГУГиТ · УМНОЕ РАСПИСАНИЕ</div>
</div>
<div class="toast" id="toast"></div>
<script>
(() => {
 const tg=window.Telegram?.WebApp;
 const initData=tg?.initData||"";
 const params=new URLSearchParams(location.search);
 let data=null, selected=null, tab="home", busy=false;
 const $=id=>document.getElementById(id);
 const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const chat=()=>data?.chats?.find(x=>String(x.chat.chat_id)===String(selected))?.chat;
 const perms=()=>data?.chats?.find(x=>String(x.chat.chat_id)===String(selected))?.bot||{};
 const notify=(s)=>{const el=$("toast");el.textContent=s;el.classList.add("show");setTimeout(()=>el.classList.remove("show"),2300);tg?.HapticFeedback?.notificationOccurred?.("success")};
 async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"X-Telegram-Init-Data":initData,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok){const t=await r.text();throw new Error(t||"Ошибка сервера")}return r.json()}
 function switcher(key,label,sub){const on=!!chat()[key];return '<div class="setting"><div class="setting-info"><div class="setting-title">'+label+'</div><div class="setting-sub">'+sub+'</div></div><button class="switch '+(on?"on":"")+'" aria-label="'+label+'" aria-pressed="'+on+'" data-toggle="'+key+'"></button></div>'}
 function selectControl(key,values){return '<select class="control" data-setting="'+key+'">'+values.map(([v,l])=>'<option value="'+esc(v)+'" '+(String(chat()[key])===String(v)?"selected":"")+'>'+esc(l)+'</option>').join("")+'</select>'}
 function render(){
  const c=chat(), p=perms();
  if(!c){$("content").innerHTML='<div class="empty"><div class="big">🛰️</div><h2>Пока нет доступных групп</h2><p>Добавьте бота в группу и откройте панель от имени администратора. Управлять настройками может администратор чата или тот, кто добавил бота.</p></div>';return}
  const groupOptions=data.chats.map(x=>'<option value="'+x.chat.chat_id+'" '+(String(selected)===String(x.chat.chat_id)?"selected":"")+'>'+esc(x.chat.title)+(x.chat.group_name?" · "+esc(x.chat.group_name):"")+'</option>').join("");
  const tabs=[["home","⌂","Обзор"],["chat","✧","Общение"],["alerts","◉","Уведомл."],["rights","♢","Права"]];
  $("content").innerHTML=
  '<section class="hero"><div class="eyebrow">Центр управления · СГУГиТ</div><h1>Всё под<br>контролем.</h1><p>Настройте бота так, чтобы он помогал группе и не мешал общению.</p><div class="select-wrap"><label for="chatSelect">УПРАВЛЯЕМЫЙ ЧАТ</label><select class="select" id="chatSelect">'+groupOptions+'</select></div></section>'+
  '<div class="stats"><div class="stat"><div class="stat-icon">📅</div><div class="stat-value">'+(c.group_name?esc(c.group_name):"Не выбрана")+'</div><div class="stat-label">Учебная группа</div></div><div class="stat"><div class="stat-icon">🔔</div><div class="stat-value">'+(c.notifications_on?"Активны":"Выключены")+'</div><div class="stat-label">Уведомления</div></div><div class="stat"><div class="stat-icon">🛡️</div><div class="stat-value">'+(p.status==="administrator"||p.status==="creator"?"Админ":"Участник")+'</div><div class="stat-label">Права бота</div></div></div>'+
  '<nav class="tabs">'+tabs.map(([id,ico,label])=>'<button class="tab '+(tab===id?"active":"")+'" data-tab="'+id+'"><span class="tabico">'+ico+'</span>'+label+'</button>').join("")+'</nav>'+
  '<section class="view '+(tab==="home"?"active":"")+'" data-view="home">'+
    '<div class="section-head"><h2>Быстрый контроль</h2><span>Основные функции</span></div>'+
    '<div class="card">'+switcher("notifications_on","Уведомления в группе","Общий выключатель групповых уведомлений.")+switcher("evening_on","Расписание на завтра","Вечерняя сводка в выбранное время.")+switcher("pin_on","Закреплять расписание","Снять закреп и удалить сводку после последней пары.")+switcher("cleanup_on","Чистить историю запросов","Удалять вопрос о расписании и ответ после последней пары.")+'</div>'+
    '<div class="notice"><span>✦</span><div><b>Чат без мусора.</b> Закреплённая сводка удаляется по расписанию. Служебное уведомление Telegram о закреплении не затрагивается.</div></div>'+
    '<button class="btn secondary" data-tab="rights">Проверить права бота →</button>'+
  '</section>'+
  '<section class="view '+(tab==="chat"?"active":"")+'" data-view="chat">'+
    '<div class="section-head"><h2>Манера общения</h2><span>Поведение в чате</span></div><div class="card">'+
    '<div class="setting"><div class="setting-info"><div class="setting-title">Режим ответов</div><div class="setting-sub">Когда бот реагирует на сообщения.</div></div>'+selectControl("smart_mode",[["off","Выключен"],["mention","По упоминанию"],["keywords","По ключевым фразам"],["active","Если никто не ответил"]])+'</div>'+
    '<div class="setting"><div class="setting-info"><div class="setting-title">Ждать ответ людей</div><div class="setting-sub">Пауза перед ответом бота в активном режиме.</div></div>'+selectControl("wait_min",[[15,"15 минут"],[30,"30 минут"],[60,"1 час"],[120,"2 часа"]])+'</div>'+
    '<div class="setting"><div class="setting-info"><div class="setting-title">Автоудаление обычных ответов</div><div class="setting-sub">Убирать короткие ответы бота через выбранное время.</div></div>'+selectControl("autodelete_min",[[0,"Не удалять"],[1,"1 минута"],[5,"5 минут"],[15,"15 минут"],[60,"1 час"]])+'</div>'+
    switcher("cleanup_on","Удалять вопросы о расписании","Команда пользователя и ответ бота удаляются после последней пары запрошенного дня.")+
    '</div><div class="notice"><span>ℹ️</span><div>Удаление сообщений участников работает только если боту выданы права администратора <b>«Удаление сообщений»</b>. Свои ответы бот может удалить сам.</div></div>'+
  '</section>'+
  '<section class="view '+(tab==="alerts"?"active":"")+'" data-view="alerts">'+
    '<div class="section-head"><h2>Уведомления</h2><span>Никакого лишнего шума</span></div><div class="card">'+
    switcher("notifications_on","Все уведомления группы","Отключает вечерние сводки и уведомления об изменениях.")+
    '<div class="setting"><div class="setting-info"><div class="setting-title">Время вечерней сводки</div><div class="setting-sub">Когда отправлять расписание на завтра.</div></div>'+selectControl("evening_time",[["19:00","19:00"],["20:00","20:00"],["21:00","21:00"],["22:00","22:00"]])+'</div>'+
    switcher("changes_on","Изменения расписания","Сообщать группе, если расписание изменилось на сайте.")+
    switcher("evening_on","Вечерняя сводка","Присылать расписание на завтра.")+
    switcher("pin_on","Закреплять вечернюю сводку","Закрепить до конца последней пары следующего дня.")+
    '</div><div class="notice"><span>🔕</span><div>Главный переключатель отключает уведомления именно в группе. Личные настройки напоминаний пользователей остаются их собственными.</div></div>'+
  '</section>'+
  '<section class="view '+(tab==="rights"?"active":"")+'" data-view="rights">'+
    '<div class="section-head"><h2>Права и безопасность</h2><span>Проверка в Telegram</span></div><div class="card">'+
    permission("Закреплять сообщения",p.can_pin_messages,"Нужно для закрепления вечернего расписания и последующего открепления.")+
    permission("Удалять сообщения",p.can_delete_messages,"Нужно, чтобы удалять команды участников вместе с ответами после последней пары.")+
    permission("Отправлять сообщения",p.can_send_messages,"Нужно, чтобы отвечать на вопросы и присылать сводки.")+
    '</div><div class="notice"><span>🛡️</span><div><b>Минимальные права.</b> Не выдавайте боту лишних разрешений. Для полного набора функций достаточно разрешений на закрепление и удаление сообщений, а также возможности отправлять сообщения.</div></div>'+
    '<div class="card"><div class="title">Как выдать права</div><div class="desc" style="margin-top:8px">Откройте группу → Управление группой → Администраторы → выберите бота. Включите только необходимые разрешения и сохраните.</div></div>'+
  '</section>';
  $("chatSelect").addEventListener("change",e=>{selected=e.target.value;tab="home";render()});
  document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;render();tg?.HapticFeedback?.selectionChanged?.()}));
  document.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click",()=>save({[b.dataset.toggle]:!chat()[b.dataset.toggle]})));
  document.querySelectorAll("[data-setting]").forEach(s=>s.addEventListener("change",()=>{const v=["wait_min","autodelete_min"].includes(s.dataset.setting)?Number(s.value):s.value;save({[s.dataset.setting]:v})}));
 }
 function permission(label,ok,description){return '<div class="permission"><div class="ico">✓</div><div class="grow"><div class="title">'+label+'</div><p>'+description+'</p></div><span class="status '+(ok?"ok":"bad")+'">'+(ok?"ЕСТЬ":"НЕТ")+'</span></div>'}
 async function save(change){if(busy)return;busy=true;try{const res=await api("/api/settings",{chat_id:Number(selected),...change});const item=data.chats.find(x=>String(x.chat.chat_id)===String(selected));item.chat=res.chat;item.bot=res.bot;render();notify("Настройка сохранена")}catch(e){notify(e.message||"Не удалось сохранить");}finally{busy=false}}
 async function start(){if(!tg||!initData){$("content").innerHTML='<div class="empty"><div class="big">✦</div><h2>Откройте панель в Telegram</h2><p>Это приложение работает внутри Telegram. Вернитесь в чат с ботом и нажмите «Управление ботом».</p></div>';return}
  tg.ready();tg.expand();tg.setHeaderColor?.("#101a2c");tg.setBackgroundColor?.("#0b1424");tg.disableVerticalSwipes?.();
  try{data=await api("/api/bootstrap"+(params.get("chat_id")?"?chat_id="+encodeURIComponent(params.get("chat_id")):""));selected=String(data.selected_chat_id||data.chats?.[0]?.chat.chat_id||"");render()}catch(e){$("content").innerHTML='<div class="empty"><div class="big">🔒</div><h2>Нет доступа</h2><p>'+esc(e.message||"Не удалось проверить права. Откройте приложение повторно из группы.")+'</p><button class="btn" onclick="location.reload()">Повторить</button></div>'}
 }
 start();
})();
</script>
</body>
</html>
