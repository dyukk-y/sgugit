<script>(()=>{const tg=window.Telegram?.WebApp,initData=tg?.initData||"",params=new URLSearchParams(location.search);let data=null,selected=null,tab="home",busy=false;const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const item=()=>data?.chats?.find(x=>String(x.chat.chat_id)===String(selected)),chat=()=>item()?.chat,perms=()=>item()?.bot||{};function toast(s){const e=$("toast");e.textContent=s;e.classList.add("show");setTimeout(()=>e.classList.remove("show"),2200);tg?.HapticFeedback?.notificationOccurred?.("success")}async function api(path,body){const r=await fetch(path,{method:body?"POST":"GET",headers:{"X-Telegram-Init-Data":initData,...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});if(!r.ok)throw new Error((await r.text())||"Не удалось выполнить действие");return r.json()}function sw(k,l,d){let on=!!chat()[k];return '<div class="setting"><div class="setting-info"><div class="setting-title">'+l+'</div><div class="setting-sub">'+d+'</div></div><button class="switch '+(on?"on":"")+'" data-toggle="'+k+'" aria-label="'+l+'" aria-pressed="'+on+'"></button></div>'}function select(k,values){return '<select class="control" data-setting="'+k+'">'+values.map(([v,l])=>'<option value="'+esc(v)+'" '+(String(chat()[k])===String(v)?"selected":"")+'>'+esc(l)+'</option>').join("")+'</select>'}function permission(label,ok,desc){return '<div class="permission"><div class="ico">'+(ok?"✓":"!")+'</div><div style="flex:1"><b class="setting-title">'+label+'</b><p>'+desc+'</p></div><span class="status '+(ok?"ok":"bad")+'">'+(ok?"ЕСТЬ":"НЕТ")+'</span></div>'}function scene(){return '<svg viewBox="0 0 360 260" fill="none" aria-hidden="true"><g stroke="#dce9f7" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path class="draw" d="M75 213V102l105-63 105 63v111M55 213h250M95 213v-88h170v88M105 125l75-45 75 45M112 103h136M130 213v-54h3 >'<button class="tab '+(tab===id?"active":"")+'" data-tab="'+id+'"><span>'+ic+'</span>'+l+'</button>').join("")+'</nav>'+
'<section class="view '+(tab==="home"?"active":"")+'" data-view="home"><div class="section-head"><h2>Главное</h2><small>Часто используемое</small></div><div class="card">'+sw("notifications_on","Уведомления группы","Один переключатель для групповых сообщений.")+sw("evening_on","План на завтра","Вечером бот сам пришлёт расписание.")+sw("pin_on","Закреплять расписание","После последней пары бот снимет закреп и удалит свою сводку.")+sw("cleanup_on","Убирать старые вопросы","Вопрос и ответ о расписании исчезнут после последней пары.")+'</div><div class="notice"><span>✦</span><div><b>Тихая автоматизация.</b> Бот убирает только свои сообщения и выбранные запросы. Служебные уведомления Telegram не затрагиваются.</div></div><button class="btn secondary" data-tab="rights">Проверить, всё ли готово →</button></section>'+
'<section class="view '+(tab==="chat"?"active":"")+'" data-view="chat"><div class="section-head"><h2>Общение</h2><small>Бот подстраивается под группу</small></div><div class="card"><div class="setting"><div class="setting-info"><div class="setting-title">Учебная группа</div><div class="setting-sub">Расписание, которое бот будет показывать.</div></div><select class="control" data-setting="group_id"><option value="">Не выбрана</option>'+data.groups.map(g=>'<option value="'+g.id+'" '+(String(c.group_id)===String(g.id)?"selected":"")+'>'+esc(g.name)+'</option>').join("")+'</select></div><div class="setting"><div class="setting-info"><div class="setting-title">Когда отвечать</div><div class="setting-sub">Выберите комфортный режим.</div></div>'+select("smart_mode",[["off","Не отвечать"],["mention","По упоминанию"],["keywords","По фразам"],["active","Если люди молчат"]])+'</div><div class="setting"><div class="setting-info"><div class="setting-title">Подождать ответа группы</div><div class="setting-sub">Перед тем как бот подключится к вопросу.</div></div>'+select("wait_min",[[15,"15 минут"],[30,"30 минут"],[60,"1 час"],[120,"2 часа"]])+'</div><div class="setting"><div class="setting-info"><div class="setting-title">Автоудаление ответов</div><div class="setting-sub">Сколько хранить короткие ответы бота.</div></div>'+select("autodelete_min",[[0,"Не удалять"],[1,"1 минута"],[5,"5 минут"],[15,"15 минут"],[60,"1 час"]])+'</div>'+sw("cleanup_on","Удалять запросы о расписании","После завершения последней пары указанного дня.")+'</div><div class="notice">ℹ️ Для удаления сообщений участников боту нужно право администратора «Удаление сообщений». Свои ответы бот может удалять самостоятельно.</div></section>'+
'<section class="view '+(tab==="alerts"?"active":"")+'" data-view="alerts"><div class="section-head"><h2>События и уведомления</h2><small>Только важное</small></div><div class="card">'+sw("notifications_on","Уведомления группы","Главный переключатель групповых оповещений.")+'<div class="setting"><div class="setting-info"><div class="setting-title">Время вечернего плана</div><div class="setting-sub">Когда присылать расписание на завтра.</div></div>'+select("evening_time",[["19:00","19:00"],["20:00","20:00"],["21:00","21:00"],["22:00","22:00"]])+'</div>'+sw("changes_on","Изменения расписания","Сообщать, если на сайте изменились пары.")+sw("evening_on","Вечерний план на завтра","Автоматически отправлять расписание.")+sw("pin_on","Закреплять план","Убирать закреп после последней пары.")+'</div><div class="notice">🔕 Личные напоминания студентов не меняются — здесь настраиваются только сообщения группы.</div></section>'+
'<section class="view '+(tab==="rights"?"active":"")+'" data-view="rights"><div class="section-head"><h2>Всё готово к работе?</h2><small>Проверка Telegram</small></div><div class="card">'+permission("Бот добавлен в группу",!!p.status,"Статус бота в выбранном чате.")+permission("Закрепление сообщений",!!p.can_pin_messages,"Нужно, чтобы закреплять расписание и снимать закреп.")+permission("Удаление сообщений",!!p.can_delete_messages,"Нужно для автоматической очистки сообщений.")+'</div><div class="notice">Права выдаёт только администратор группы. Telegram заранее отметит необходимые разрешения при добавлении бота, но подтверждение остаётся за владельцем или администратором.</div><button class="btn secondary" data-refresh>Обновить проверку</button></section>'}
async function save(change){if(busy)return;busy=true;try{const r=await api("/api/settings",{chat_id:Number(selected),...change});const x=item();x.chat=r.chat;x.bot=r.bot;render();toast("Готово, настройка сохранена")}catch(e){toast(e.message||"Не удалось сохранить")}finally{busy=false}}$("content").addEventListener("click",e=>{const t=e.target.closest("[data-tab],[data-toggle],[data-refresh]");if(!t)return;if(t.dataset.tab){tab=t.dataset.tab;render()}else if(t.dataset.toggle){const k=t.dataset.toggle;save({[k]:!chat()[k]})}else if(t.hasAttribute("data-refresh")){start()}});$("content").addEventListener("change",e=>{if(e.target.id==="chatSelect"){selected=e.target.value;tab="home";render()}else if(e.target.dataset.setting){let v=e.target.value;if(["group_id","wait_min","autodelete_min"].includes(e.target.dataset.setting))v=v===""?null:Number(v);save({[e.target.dataset.setting]:v})}});async function start(){if(!tg||!initData){$("content").innerHTML='<div class="empty"><h2>Откройте в Telegram</h2><p>Вернитесь в чат с ботом и нажмите кнопку «Управление» — так Telegram сможет безопасно проверить ваши права.</p></div>';return}tg.ready();tg.expand();tg.setHeaderColor?.("#0b1423");tg.setBackgroundColor?.("#091321");try{data=await api("/api/bootstrap"+(params.get("chat_id")?"?chat_id="+encodeURIComponent(params.get("chat_id")):""));selected=String(data.selected_chat_id||data.chats?.[0]?.chat.chat_id||"");render()}catch(e){$("content").innerHTML='<div class="empty"><h2>Не получилось открыть панель</h2><p>'+esc(e.message||"Проверьте доступ и попробуйте ещё раз.")+'</p><button class="btn" data-refresh>Повторить</button></div>'}}start()})();</script></body></html>
