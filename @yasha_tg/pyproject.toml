[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="sgugit-student-service"
version="2.3.1"
description="Production Telegram student service for SGUGiT"
requires-python=">=3.12"
dependencies=[
  "python-telegram-bot[job-queue]>=21.0,<23",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-dotenv>=1.0,<2",
]

[tool.pytest.ini_options]
testpaths=["tests"]

[tool.setuptools.packages.find]
where=["src"]

[project.scripts]
sgugit-bot="sgugit_bot.main:main"
