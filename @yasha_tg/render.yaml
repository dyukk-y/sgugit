services:
  - type: web
    name: sgugit-student-service
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python src/sgugit_bot/main.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: DB_PATH
        value: ./data/sgugit.sqlite3
      - key: PYTHON_VERSION
        value: 3.12.8
