name: Python checks

on:
  push:
    branches: ["main", "feature/group-schedule-updates"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q app tests
      - name: Check Mini App JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/web/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>([\\s\\S]*?)</script>", html)
          if len(scripts) != 1:
              raise SystemExit("Expected exactly one inline Mini App script")
          Path("/tmp/miniapp.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/miniapp.js
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
