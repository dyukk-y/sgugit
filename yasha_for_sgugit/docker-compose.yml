# Для локального запуска с PostgreSQL: docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: bot
      POSTGRES_DB: bot
    volumes: [pgdata:/var/lib/postgresql/data]
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bot:bot@db:5432/bot
    depends_on: [db]
    restart: unless-stopped
volumes:
  pgdata:
